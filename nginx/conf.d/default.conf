# Rate limiting zones for auth endpoints
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Use Docker's embedded DNS so container IP changes are picked up automatically
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name redzone-soccer.com www.redzone-soccer.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Fallback for IP/other hostnames on port 80 (health checks, internal)
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /health {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location / {
        set $front http://frontend:3000;
        proxy_pass $front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name redzone-soccer.com www.redzone-soccer.com;

    ssl_certificate     /etc/letsencrypt/live/redzone-soccer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redzone-soccer.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://us-mia-1.linodeobjects.com https://*.bbci.co.uk https://*.guim.co.uk https://*.365dm.com https://*.espncdn.com https://*.football-italia.net https://*.uecdn.es https://*.marca.com https://*.estaticos-marca.com https://*.epimg.net https://*.90min.com https://*.minutemediacdn.com https://*.futureplc.com https://*.futurecdn.net https://*.mundodeportivo.com https://*.sport.es https://*.prensaiberica.es https://*.espn.com.br https://*.record.pt https://*.zerozero.pt https://*.imgresizer.eurosport.com https://*.giphy.com; font-src 'self'; connect-src 'self' https://api.giphy.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Rate-limited auth endpoints (5 req/min per IP)
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # API routes → FastAPI backend
    location /api/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # OpenAPI docs
    location /docs {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Health check endpoint
    location /health {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Next.js static assets
    location /_next/static/ {
        set $front http://frontend:3000;
        proxy_pass $front;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Avatar uploads (served from volume)
    location /uploads/avatars/ {
        alias /data/avatars/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Everything else → Next.js frontend
    location / {
        set $front http://frontend:3000;
        proxy_pass $front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
